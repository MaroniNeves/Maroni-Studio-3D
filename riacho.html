<script>

<script>
(function () {
if (!window.THREE) { showError('three.js não carregou (sem conexão com unpkg.com).'); return; }

// Merge duplicate vertices so normals come out smooth
function mergeVertices(g) {
  const p = g.attributes.position, map = new Map(), pos = [], idx = [];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = Math.round(x * 1e4) + '_' + Math.round(y * 1e4) + '_' + Math.round(z * 1e4);
    let j = map.get(k);
    if (j === undefined) { j = pos.length / 3; map.set(k, j); pos.push(x, y, z); }
    idx.push(j);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setIndex(idx);
  return out;
}

// Small orbit camera: drag to rotate, wheel / pinch to zoom, with damping
class OrbitControls {
  constructor(camera, el) {
    this.camera = camera; this.target = new THREE.Vector3();
    this.minDistance = 1; this.maxDistance = 100; this.minPolarAngle = 0; this.maxPolarAngle = Math.PI;
    this.enableDamping = true; this.dampingFactor = 0.06; this.enablePan = false;
    this.sph = new THREE.Spherical(); this.dTheta = 0; this.dPhi = 0; this.scale = 1;
    const pts = new Map(); let pinch = 0;
    el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; });
    el.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 1) {
        const h = el.clientHeight || 1;
        this.dTheta -= 2 * Math.PI * (e.clientX - prev[0]) / h * 0.5;
        this.dPhi -= 2 * Math.PI * (e.clientY - prev[1]) / h * 0.5;
      } else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (pinch) this.scale *= pinch / d;
        pinch = d;
      }
    });
    const up = e => { pts.delete(e.pointerId); pinch = 0; };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); this.scale *= Math.pow(1.0015, e.deltaY); }, { passive: false });
  }
  sync() { this.sph.setFromVector3(this.camera.position.clone().sub(this.target)); this.dTheta = this.dPhi = 0; this.scale = 1; this.update(); }
  update() {
    const f = this.enableDamping ? this.dampingFactor : 1;
    this.sph.theta += this.dTheta * f; this.sph.phi += this.dPhi * f;
    this.sph.phi = Math.min(Math.max(this.sph.phi, this.minPolarAngle), this.maxPolarAngle);
    this.sph.radius = Math.min(Math.max(this.sph.radius * Math.pow(this.scale, f), this.minDistance), this.maxDistance);
    this.dTheta *= 1 - f; this.dPhi *= 1 - f; this.scale = Math.pow(this.scale, 1 - f);
    this.camera.position.setFromSpherical(this.sph).add(this.target);
    this.camera.lookAt(this.target);
  }
}

THREE.ColorManagement.enabled = false;

// ---------------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------------
const MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;
const LOOP = 10;                       // seconds; grass / leaves / dapple loop period
const GRASS_COUNT = MOBILE ? 14000 : 26000;
const FERN_COUNT = MOBILE ? 26 : 40;
const PEBBLE_COUNT = MOBILE ? 650 : 1000;
const SIM = { minX: -20, minZ: -8, sizeX: 40, sizeZ: 16, resX: 512, resZ: 205 };
const SUN = new THREE.Vector3(-0.3, 0.75, -0.6).normalize();

// ---------------------------------------------------------------------------
// JS helpers (terrain shape mirrored in GLSL below)
// ---------------------------------------------------------------------------
let seed = 1337;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const fract = x => x - Math.floor(x);
const h2 = (x, y) => fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453);
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const h3 = (x, y, z) => fract(Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453);
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const L = (a, b, t) => a + (b - a) * t;
  return L(L(L(h3(xi, yi, zi), h3(xi + 1, yi, zi), u), L(h3(xi, yi + 1, zi), h3(xi + 1, yi + 1, zi), u), v),
           L(L(h3(xi, yi, zi + 1), h3(xi + 1, yi, zi + 1), u), L(h3(xi, yi + 1, zi + 1), h3(xi + 1, yi + 1, zi + 1), u), v), w);
}

const rcenter = x => 1.6 * Math.sin(x * 0.11 + 0.6) + 0.5 * Math.sin(x * 0.29 + 2.0);
const rcenterD = x => 0.176 * Math.cos(x * 0.11 + 0.6) + 0.145 * Math.cos(x * 0.29 + 2.0);
const rhalfW = x => 4.3 + 0.8 * Math.sin(x * 0.19 + 1.3) + 0.4 * Math.sin(x * 0.43);
const maxDepth = x => 0.5 + 1.15 * Math.exp(-(((x - 1.0) / 5.5) ** 2)) + 0.18 * Math.sin(x * 0.37 + 0.4);
const chanS = (x, z) => Math.abs(z - rcenter(x)) / rhalfW(x);

function bedHeight(x, z) {
  const s = chanS(x, z);
  const ch = -maxDepth(x) * Math.pow(Math.max(1 - s * s, 0), 0.75);
  const bank = 0.75 * smooth(0.92, 1.55, s) + 0.55 * smooth(1.6, 3.2, s) + 0.5 * smooth(3.5, 6.5, s);
  const n = vnoise(x * 0.55 + 10, z * 0.55) - 0.5;
  const n2 = vnoise(x * 2.1, z * 2.1 + 5) - 0.5;
  return ch + bank + n * (0.14 + 0.4 * smooth(1, 2, s)) + n2 * 0.06;
}

// Rocks in the stream (they block flow / ripples) and on the banks
const waterRocks = [], allRocks = [];
function addRock(x, u, R, top, inWater) {
  const z = rcenter(x) + u * rhalfW(x);
  const Ry = R * (inWater ? 0.85 : 0.75);
  const bed = bedHeight(x, z);
  const cy = inWater ? top - Ry : bed + Ry * 0.35;
  const rock = { x, z, R, Ry, cy, rw: 0 };
  if (inWater && Math.abs(cy) < Ry) { rock.rw = R * Math.sqrt(1 - (cy / Ry) ** 2); waterRocks.push(rock); }
  allRocks.push(rock);
}
addRock(-7.0, 0.22, 1.35, 0.75, true);
addRock(-1.8, -0.42, 1.05, 0.5, true);
addRock(4.6, 0.3, 1.6, 0.95, true);
addRock(9.2, -0.25, 0.85, 0.35, true);
addRock(-12.0, -0.3, 0.95, 0.4, true);
addRock(1.6, 0.68, 0.6, 0.22, true);
addRock(-4.2, -1.32, 1.8, 0, false);
addRock(7.4, 1.35, 2.0, 0, false);
addRock(13.0, -1.28, 1.4, 0, false);
addRock(-13.5, 1.3, 1.6, 0, false);
const NWR = waterRocks.length, NAR = allRocks.length;

function flowJS(x, z) {
  let tx = 1, tz = rcenterD(x); const l = Math.hypot(tx, tz); tx /= l; tz /= l;
  const nx = -tz, nz = tx;
  const U = 0.42 * (1 - 0.75 * smooth(0.45, 1.0, chanS(x, z)));
  let vx = tx * U, vz = tz * U;
  for (const r of waterRocks) {
    const dx0 = x - r.x, dz0 = z - r.z;
    const r2 = Math.max(dx0 * dx0 + dz0 * dz0, r.rw * r.rw * 0.8);
    const k = r.rw * r.rw / (r2 * r2);
    const dx = dx0 * tx + dz0 * tz, dy = dx0 * nx + dz0 * nz;
    const pu = -k * (dx * dx - dy * dy), pv = -k * 2 * dx * dy;
    vx += U * (tx * pu + nx * pv); vz += U * (tz * pu + nz * pv);
  }
  return [vx, vz];
}

// ---------------------------------------------------------------------------
// Renderer / camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const gl = renderer.getContext();
if (!renderer.extensions.has('EXT_color_buffer_float') && !renderer.extensions.has('EXT_color_buffer_half_float')) {
  console.warn('Half-float render targets may be unsupported; ripples may not show.');
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0.06, 0.11, 0.08);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 7; controls.maxDistance = 32;
controls.minPolarAngle = 0.15; controls.maxPolarAngle = 1.25;
controls.enablePan = false;
function frameCamera() {
  const a = innerWidth / innerHeight;
  camera.aspect = a;
  if (a < 1) {            // portrait: look along the stream so it runs up the screen
    camera.fov = 56;
    camera.position.set(14, 13, 3.5);
    controls.target.set(-1.5, -0.5, 0.2);
  } else {
    camera.fov = 40;
    camera.position.set(0, 13, 14);
    controls.target.set(0, -0.5, 0.5);
  }
  camera.updateProjectionMatrix();
  controls.sync();
}
frameCamera();

// ---------------------------------------------------------------------------
// Shared uniforms + GLSL
// ---------------------------------------------------------------------------
const shared = {
  uTime: { value: 0 },
  uLoop: { value: 0 },
  uSunDir: { value: SUN },
  uSunCol: { value: new THREE.Vector3(1.0, 0.92, 0.72) },
  uWRocks: { value: waterRocks.map(r => new THREE.Vector4(r.x, r.z, r.rw, 0)) },
  uARocks: { value: allRocks.map(r => new THREE.Vector4(r.x, r.cy, r.z, r.R * 0.9)) },
  uSim: { value: null },
  uSimRect: { value: new THREE.Vector4(SIM.minX, SIM.minZ, SIM.sizeX, SIM.sizeZ) },
  uSimTexel: { value: new THREE.Vector2(1 / SIM.resX, 1 / SIM.resZ) },
  uBfly: { value: new THREE.Vector3(0, 5, 0) },
  uFogCol: { value: new THREE.Vector3(0.1, 0.17, 0.13) },
};

const COMMON = /* glsl */`
#define PI 3.14159265
#define TAU 6.28318531
#define NWR ${NWR}
#define NAR ${NAR}
uniform float uTime;
uniform float uLoop;
uniform vec3 uSunDir;
uniform vec3 uSunCol;
uniform vec4 uWRocks[NWR];
uniform vec4 uARocks[NAR];
uniform sampler2D uSim;
uniform vec4 uSimRect;
uniform vec2 uSimTexel;
uniform vec3 uBfly;
uniform vec3 uFogCol;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p; a*=.5; } return s; }
float fbm3o(vec2 p){ float a=.5, s=0.; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p; a*=.5; } return s; }

float rcenter(float x){ return 1.6*sin(x*0.11+0.6) + 0.5*sin(x*0.29+2.0); }
float rcenterD(float x){ return 0.176*cos(x*0.11+0.6) + 0.145*cos(x*0.29+2.0); }
float rhalfW(float x){ return 4.3 + 0.8*sin(x*0.19+1.3) + 0.4*sin(x*0.43); }
float channelS(vec2 p){ return abs(p.y - rcenter(p.x)) / rhalfW(p.x); }

vec2 flowVel(vec2 p){
  vec2 t = normalize(vec2(1.0, rcenterD(p.x)));
  vec2 nr = vec2(-t.y, t.x);
  float U = 0.42 * (1.0 - 0.75*smoothstep(0.45, 1.0, channelS(p)));
  vec2 v = t*U;
  for(int i=0;i<NWR;i++){
    vec4 r = uWRocks[i];
    vec2 d = p - r.xy;
    float r2 = max(dot(d,d), r.z*r.z*0.8);
    float k = r.z*r.z/(r2*r2);
    float dx = dot(d,t), dy = dot(d,nr);
    v += U*( t*(-k*(dx*dx-dy*dy)) + nr*(-k*2.0*dx*dy) );
  }
  return v;
}

float waterMask(vec2 p){
  float m = 1.0 - smoothstep(1.02, 1.12, channelS(p));
  for(int i=0;i<NWR;i++){ vec4 r = uWRocks[i]; m *= smoothstep(r.z*0.9, r.z*1.0, length(p-r.xy)); }
  return m;
}

vec2 simUV(vec2 p){ return (p - uSimRect.xy)/uSimRect.zw; }
float simInside(vec2 uv){ return step(0.0,uv.x)*step(uv.x,1.0)*step(0.0,uv.y)*step(uv.y,1.0); }

// leaf-shadow pattern cast by the canopy, projected along the sun
float dapple(vec3 P){
  vec2 q = P.xz - uSunDir.xz/uSunDir.y * P.y;
  vec2 sw = vec2(sin(TAU*uLoop), cos(TAU*uLoop));
  float n  = fbm(q*0.5 + sw*0.10);
  float n2 = fbm(q*1.6 - sw*0.18 + 7.3);
  float big = smoothstep(0.3, 0.62, fbm3o(q*0.11 + 3.1));
  float d = smoothstep(0.47, 0.56, n*0.72 + n2*0.36);
  return mix(0.2, 1.0, d*mix(0.25, 1.0, big));
}

float rockShadow(vec3 P){
  float s = 1.0;
  for(int i=0;i<NAR;i++){
    vec4 r = uARocks[i];
    vec3 c = r.xyz - P;
    if (length(c) < r.w*1.35) continue;
    float t = dot(c, uSunDir);
    if (t <= 0.0) continue;
    float d = length(c - uSunDir*t);
    s *= mix(0.25, 1.0, smoothstep(r.w*0.65, r.w*1.15, d));
  }
  return s;
}

float bflyShadow(vec3 P){
  vec3 c = uBfly - P;
  float t = dot(c, uSunDir);
  if (t <= 0.0) return 1.0;
  float d = length(c - uSunDir*t);
  return mix(0.45, 1.0, smoothstep(0.05, 0.28 + t*0.03, d));
}

float sunVis(vec3 P){ return dapple(P)*rockShadow(P)*bflyShadow(P); }

vec3 ambientCol(vec3 N){ return mix(vec3(0.17,0.21,0.13), vec3(0.40,0.53,0.56), N.y*0.5+0.5); }

float vorEdge(vec2 p, float t){
  vec2 n = floor(p), f = fract(p);
  float F1 = 8.0, F2 = 8.0;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g = vec2(float(i), float(j));
    vec2 o = hash22(n+g);
    o = 0.5 + 0.42*sin(t + TAU*o);
    vec2 r = g + o - f;
    float d = dot(r,r);
    if (d < F1){ F2 = F1; F1 = d; } else if (d < F2){ F2 = d; }
  }
  return sqrt(F2) - sqrt(F1);
}

float causticAt(vec3 P, float depth){
  vec2 q = P.xz + uSunDir.xz/uSunDir.y*depth;
  vec2 fl = vec2(uTime*0.16, 0.0);
  vec2 w = vec2(vnoise(q*0.9 + uTime*0.15), vnoise(q*0.9 + 5.2 - uTime*0.13)) - 0.5;
  vec2 q1 = q*1.25 - fl + w*0.6;
  vec2 q2 = mat2(0.8,0.6,-0.6,0.8)*q*1.7 - fl*1.3 + w*0.5 + 3.7;
  float c1 = exp(-vorEdge(q1, uTime*0.9)*10.0);
  float c2 = exp(-vorEdge(q2, uTime*1.1 + 2.0)*12.0);
  float c = c1*0.75 + c2*0.55 + c1*c2*0.8;
  // focusing from the real ripple height field
  vec2 suv = simUV(q);
  float ins = simInside(suv);
  float h  = texture2D(uSim, suv).r;
  float hl = texture2D(uSim, suv - vec2(uSimTexel.x,0.)).r;
  float hr = texture2D(uSim, suv + vec2(uSimTexel.x,0.)).r;
  float hd = texture2D(uSim, suv - vec2(0.,uSimTexel.y)).r;
  float hu = texture2D(uSim, suv + vec2(0.,uSimTexel.y)).r;
  float lap = (hl+hr+hd+hu-4.0*h);
  c += clamp(-lap*55.0*clamp(depth*1.5,0.3,1.5), -0.6, 2.0) * ins;
  return c * smoothstep(0.0, 0.14, depth) * mix(1.0, 0.45, smoothstep(0.9, 2.2, depth));
}

vec3 litColor(vec3 albedo, vec3 N, vec3 P, float ao){
  float vis = sunVis(P);
  float ndl = dot(N, uSunDir);
  float wrap = smoothstep(-0.15, 0.6, ndl);
  vec3 col = albedo * (ambientCol(N)*ao*0.95 + uSunCol*wrap*vis*1.05);
  float depth = -P.y;
  if (depth > 0.0){
    col *= 0.9;
    col += albedo * uSunCol * causticAt(P, depth) * vis * smoothstep(-0.3, 0.3, ndl) * 1.5;
  } else {
    col *= mix(0.72, 1.0, smoothstep(0.0, 0.09, P.y));   // wet band at the waterline
  }
  return col;
}

vec3 fogIt(vec3 col, vec3 P){
  float d = length(P - cameraPosition);
  return mix(col, uFogCol, smoothstep(24.0, 62.0, d)*0.85);
}
`;

const mkMat = (o) => new THREE.ShaderMaterial({ ...o, uniforms: { ...shared, ...(o.uniforms || {}) } });

// ---------------------------------------------------------------------------
// Ripple height-field simulation (GPU ping-pong)
// ---------------------------------------------------------------------------
const simOpts = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false, wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping };
let simA = new THREE.WebGLRenderTarget(SIM.resX, SIM.resZ, simOpts);
let simB = new THREE.WebGLRenderTarget(SIM.resX, SIM.resZ, simOpts);
renderer.setClearColor(0x000000, 0);
for (const t of [simA, simB]) { renderer.setRenderTarget(t); renderer.clear(); }
renderer.setRenderTarget(null);
renderer.setClearColor(scene.background, 1);

const MAXDROPS = 4;
const simMat = mkMat({
  uniforms: { uPrev: { value: null }, uDt: { value: 1 / 60 },
    uDrops: { value: Array.from({ length: MAXDROPS }, () => new THREE.Vector4()) }, uNumDrops: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: COMMON + `
    uniform sampler2D uPrev; uniform float uDt; uniform vec4 uDrops[${MAXDROPS}]; uniform int uNumDrops;
    varying vec2 vUv;
    void main(){
      vec2 p = uSimRect.xy + vUv*uSimRect.zw;
      vec2 v = flowVel(p);
      vec2 uv = vUv - v*uDt/uSimRect.zw;              // drift with the current
      vec4 c = texture2D(uPrev, uv);
      float h = c.r, hp = c.g;
      float l = texture2D(uPrev, uv - vec2(uSimTexel.x,0.)).r;
      float r = texture2D(uPrev, uv + vec2(uSimTexel.x,0.)).r;
      float d = texture2D(uPrev, uv - vec2(0.,uSimTexel.y)).r;
      float u = texture2D(uPrev, uv + vec2(0.,uSimTexel.y)).r;
      float lap = l + r + d + u - 4.0*h;

// ---------------------------------------------------------------------------
// Tileable water detail texture: RG = normal, B = height, A = foam noise
// ---------------------------------------------------------------------------
function makeWaterTex(N = 256) {
  const ih = (x, y, s) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const pn = (x, y, P, s) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const m = a => ((a % P) + P) % P;
    const a = ih(m(xi), m(yi), s), b = ih(m(xi + 1), m(yi), s), c = ih(m(xi), m(yi + 1), s), d = ih(m(xi + 1), m(yi + 1), s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const H = new Float32Array(N * N), F = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const fx = x / N, fy = y / N;
    let h = 0, a = 0.5, P = 4;
    for (let o = 0; o < 5; o++) { const n = pn(fx * P, fy * P, P, o + 1); h += a * (1 - Math.abs(2 * n - 1)) ** 1.6; a *= 0.5; P *= 2; }
    H[y * N + x] = h;
    let f = 0; a = 0.5; P = 8;
    for (let o = 0; o < 4; o++) { f += a * pn(fx * P, fy * P, P, o + 11); a *= 0.5; P *= 2; }
    F[y * N + x] = f;
  }
  const gx = new Float32Array(N * N), gz = new Float32Array(N * N); let mx = 1e-6;
  let hmin = 1e9, hmax = -1e9, fmin = 1e9, fmax = -1e9;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    gx[i] = H[y * N + (x + N - 1) % N] - H[y * N + (x + 1) % N];
    gz[i] = H[((y + N - 1) % N) * N + x] - H[((y + 1) % N) * N + x];
    mx = Math.max(mx, Math.abs(gx[i]), Math.abs(gz[i]));
    hmin = Math.min(hmin, H[i]); hmax = Math.max(hmax, H[i]); fmin = Math.min(fmin, F[i]); fmax = Math.max(fmax, F[i]);
  }
  const data = new Uint8Array(N * N * 4);
  for (let i = 0; i < N * N; i++) {
    data[i * 4] = Math.round((gx[i] / mx * 0.5 + 0.5) * 255);
    data[i * 4 + 1] = Math.round((gz[i] / mx * 0.5 + 0.5) * 255);
    data[i * 4 + 2] = Math.round((H[i] - hmin) / (hmax - hmin) * 255);
    data[i * 4 + 3] = Math.round((F[i] - fmin) / (fmax - fmin) * 255);
  }
  const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = true; t.needsUpdate = true;
  return t;
}

{

      const ll = len * 0.26 * Math.pow(Math.sin(Math.PI * Math.min(t * 0.95 + 0.08, 1)), 0.8) * (1 - t * 0.35);

        const tip = b.clone().addScaledVector(dir, ll);
        const m1 = b.clone().addScaledVector(dir, ll * 0.42).addScaledVector(tan, ll * 0.17);
        const m2 = b.clone().addScaledVector(dir, ll * 0.42).addScaledVector(tan, -ll * 0.17);
        for (const [q, lv] of [[b, 0], [m1, 0.45], [tip, 1], [b, 0], [tip, 1], [m2, 0.45]]) { P.push(q.x, q.y, q.z); T.push(t); L.push(lv); }

    }

    for (let i = 0; i < STEPS; i++) {
      const a = pts[i], b = pts[i + 1], w = 0.012 * (1 - i / STEPS);
      const sa = sideV.clone().multiplyScalar(w);
      const q = [a.clone().add(sa), a.clone().sub(sa), b.clone().add(sa), b.clone().sub(sa)];
      for (const k of [0, 1, 2, 1, 3, 2]) { P.push(q[k].x, q[k].y, q[k].z); T.push((i + (k >= 2 ? 1 : 0)) / STEPS); L.push(0); }

  g.setAttribute('aL', new THREE.Float32BufferAttribute(L, 1));
  g.computeVertexNormals();
  const mat = mkMat({
    side: THREE.DoubleSide,
    vertexShader: COMMON + `
      attribute float aT; attribute float aL;
      varying vec3 vW; varying vec3 vN; varying float vT; varying float vLf;
      void main(){

        float ph = dot(b.xz, vec2(0.31,0.17));

    fragmentShader: COMMON + `

      void main(){

        vec3 alb = mix(vec3(0.12,0.3,0.07), vec3(0.42,0.66,0.2), smoothstep(0.0,1.0, vLf*0.6 + vT*0.6));
        alb = mix(alb, vec3(0.62,0.74,0.28), smoothstep(0.75,1.0,vT)*0.5);
        float vis = sunVis(vW);
        vec3 V = normalize(cameraPosition - vW);
        float back = pow(max(dot(-V, uSunDir), 0.0), 3.0);
        float ndl = smoothstep(-0.2, 0.7, dot(N, uSunDir));

  const mesh = new THREE.InstancedMesh(g, mat, FERN_COUNT);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), Tv = new THREE.Vector3(), E = new THREE.Euler();
  let n = 0, guard = 0;
  while (n < FERN_COUNT && guard++ < 20000) {
    const x = -22 + rand() * 44;
    const side = rand() < 0.5 ? -1 : 1;
    const u = side * (1.12 + rand() * 1.4);
    const z = rcenter(x) + u * rhalfW(x);
    const y = bedHeight(x, z);
    if (y < 0.08) continue;
    if (allRocks.some(r => Math.hypot(x - r.x, z - r.z) < r.R * 1.1)) continue;
    const s = 0.75 + rand() * 0.7;
    S.set(s, s * (0.8 + rand() * 0.3), s);
    E.set((rand() - 0.5) * 0.25, rand() * 6.28, (rand() - 0.5) * 0.25); Q.setFromEuler(E);

}

    }`,

  bfly.position.set(tmpA.x, y, tmpA.z);
  const vx = tmpB.x - tmpA.x, vz = tmpB.z - tmpA.z;
  bfly.rotation.set(0, Math.atan2(-vz, vx), 0);
  bfly.rotateZ(0.15 + 0.15 * Math.cos(Math.PI * 2 * f));
  const flap = 0.25 + 1.05 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 7.5)) * (f < 0.12 || f > 0.9 ? 0.45 : 1);
  bfly.userData.right.rotation.x = -flap;
  bfly.userData.left.rotation.x = flap;
  shared.uBfly.value.copy(bfly.position);
  // touch the water at the bottom of each hop -> ripple ring
  if (k !== bState.lastHop) {
    bState.lastHop = k;
    const bx = tmpA.x, bz = tmpA.z;
    const overWater = bedHeight(bx, bz) < -0.04 && !waterRocks.some(r => Math.hypot(bx - r.x, bz - r.z) < r.rw * 1.05);
    if (overWater) pendingDrops.push(new THREE.Vector4(bx, bz, 0.17, 0.16));
  }
}

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  const wasPortrait = camera.aspect < 1;
  camera.aspect = innerWidth / innerHeight;
  if ((camera.aspect < 1) !== wasPortrait) frameCamera(); else camera.updateProjectionMatrix();
  makeRT();
});

const clock = new THREE.Clock();
let simAcc = 0, elapsed = 0;
const STEP = 1 / 60;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;
  shared.uTime.value = elapsed;
  shared.uLoop.value = (elapsed % LOOP) / LOOP;
  controls.update();

  updateButterfly(elapsed);
  updateLeaves(dt);

  simAcc += dt;
  let steps = 0;
  while (simAcc >= STEP && steps < 3) { simStep(STEP); simAcc -= STEP; steps++; }
  if (steps === 3) simAcc = 0;

  camera.updateMatrixWorld();
  waterUniforms.uVP.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);

  // pass 1: everything under/around the water, for refraction + depth
  water.visible = false; bfly.visible = false; floatLeaves.forEach(l => l.visible = false);
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  // pass 2: full scene with the water surface
  water.visible = true; bfly.visible = true; floatLeaves.forEach(l => l.visible = true);
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__ready = true;
})();
</script>
</body>
