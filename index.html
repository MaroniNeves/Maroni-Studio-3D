<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maroni Studio 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#f2f4f3;font:15px system-ui}header{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#1e2a34;padding:14px 18px}h1{font-size:20px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}button,a.open{border:1px solid #728477;background:#283e37;border-radius:9px;color:white;padding:10px 13px;cursor:pointer;text-decoration:none}button.active{background:#568065}main{height:calc(100dvh - 72px);position:relative}iframe{width:100%;height:100%;border:0;background:white}.links{position:absolute;right:14px;bottom:14px;background:#1e2a34;padding:10px;border-radius:10px}a{color:#d1eadd}@media(max-width:750px){header{flex-direction:column;align-items:stretch}main{height:calc(100dvh - 127px)}nav button{flex:1}}</style></head><body><header><h1>MARONI STUDIO 3D</h1><nav><button id="move" onclick="change('move')">Movimento</button><button id="rig" onclick="change('rig')">Personagem 3D · Rig</button></nav></header><main><iframe id="frame" title="Estúdio 3D"></iframe><div class="links">Caso o estúdio não apareça: <a id="direct" target="_blank" rel="noopener noreferrer">abrir diretamente</a></div></main><script>const urls={move:'https://maroni-motion-studio.maroni251096.chatgpt.site',rig:'https://personagens-rig-3d.maroni251096.chatgpt.site'};function change(id){if(!urls[id])id='move';document.getElementById('frame').src=urls[id];document.getElementById('direct').href=urls[id];for(const name of Object.keys(urls))document.getElementById(name).classList.toggle('active',id===name);history.replaceState(null,'','#'+id)}change(location.hash==='#rig'?'rig':'move')</script></body></html>
